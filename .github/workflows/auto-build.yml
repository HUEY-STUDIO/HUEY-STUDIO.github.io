name: 자동 빌드

# data/*.json 이나 assets/style.css, render.py 가 main 에 올라오면
# render.py --check → render.py --all 을 돌려서 index.html 등 산출물을
# 자동으로 다시 만들어 커밋한다. admin/ 편집기에서 저장하면 이 워크플로가
# 실제 발행(빌드)까지 이어받는다. 카드뉴스(cardnews.py, Playwright 필요)는
# 여기서 다루지 않는다 — 새 날짜의 카드뉴스는 기존처럼 로컬/세션에서 만든다.

on:
  push:
    branches: [main]
    paths:
      - 'data/**.json'
      - 'assets/style.css'
      - 'render.py'

permissions:
  contents: write

concurrency:
  group: auto-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 검증
        run: python3 render.py --check

      - name: 빌드
        run: python3 render.py --all

      - name: 산출물 커밋
        run: |
          git config user.name "heuy-archi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 빌드: admin 편집 반영"
            git push
          fi
